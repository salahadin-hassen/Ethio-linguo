name: ethio_linguo
description: "Ethiopian-first, offline-first language learning app (working title — product name not final)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  http: ^1.6.0
  # Local key-value persistence (offline). Wrapped behind ProgressStore and
  # VocabularyRepository so it can be swapped for SQLite/Drift later.
  record: ^7.2.0
  rive: ^0.14.11
  shared_preferences: ^2.3.0
  speech_to_text: ^7.5.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Bundled offline content packages. Schema: docs/INTEGRATION_CONTRACTS.md §3
    - assets/content/
    - assets/content/bus_stop_hello/
    - assets/content/bus_stop_hello/translations/
    # Original synthesized UI sounds (tool/sfx/make_sfx.py)
    - assets/sfx/
    # Rigged Rive characters (designer-authored; see docs/CHARACTER_RIG_SPEC.md)
    - assets/brand/characters/companion/
    - assets/brand/characters/professor/
    # Human cast artwork (static poses: fallback until rigs land) (see lib/features/mascot/characters.dart)
    - assets/characters/professor/
    - assets/characters/spark/
    - assets/characters/wry/
    - assets/characters/beat/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansEthiopic-ExtraBold.ttf
          weight: 800
